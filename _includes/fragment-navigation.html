<script>
// A deep link to evidence inside a disclosure must reveal its target.
(() => {
  document.addEventListener('DOMContentLoaded', () => {
    const toc = document.getElementById('TOC-body');
    if (!toc) return;
    const disclosure = document.createElement('details');
    disclosure.className = 'mobile-contents';
    const summary = document.createElement('summary');
    summary.textContent = 'On this page';
    toc.before(disclosure);
    disclosure.append(summary, toc);
    toc.addEventListener('click', (event) => {
      if (event.target.closest('a[href]')) disclosure.open = false;
    });
  });

  function revealFragment() {
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); }
    catch { return; }
    const target = document.getElementById(id);
    if (!target) return;
    // Preserve bookmarked compiler topics after splitting the companion pages.
    if (target.matches('a[data-moved-fragment]')) {
      const destination = new URL(target.href, location.href);
      if (destination.origin === location.origin && destination.pathname !== location.pathname) {
        location.replace(destination.href);
        return;
      }
    }
    let revealed = false;
    for (let ancestor = target.parentElement; ancestor; ancestor = ancestor.parentElement) {
      if (ancestor instanceof HTMLDetailsElement && !ancestor.open) {
        ancestor.open = true;
        revealed = true;
      }
    }
    if (revealed) requestAnimationFrame(() => target.scrollIntoView());
  }
  document.addEventListener('DOMContentLoaded', revealFragment);
  window.addEventListener('hashchange', revealFragment);
})();
</script>
