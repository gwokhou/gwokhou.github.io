<figcaption>
<span id="wmma-packing-title" class="visually-hidden">Eight 16-bit results: selected halves versus packed pairs</span>
<p class="figure-scope"><strong>Scope:</strong> wave32, dense 16×16×16 WMMA, with matching A/B and C/D formats: all FP16 or all BF16. The diagram follows one lane; <code>u=0…7</code> labels its logical results, and <code>V[r]</code> is a VGPR offset within the C or D operand.</p>

<p class="note">Each register is drawn <strong>high halfword on the left (bits 31:16), low halfword on the right (bits 15:0)</strong>. Blue cells hold the selected results. Gray cells mark unselected halfwords, not additional results of this operation.</p>
