<p class="note"><code>row = floor(destination_lane / 16)</code>. In wave64 the same rule also pairs rows 2 ↔ 3; X16 does not select from an arbitrary row.</p>
<p class="figure-scope"><strong>Selector difference:</strong> the RDNA 3 / 3.5 scalar forms share a 16-slot pattern; RDNA 4 VAR forms use a selector from each destination lane’s VGPR.</p>
<details class="figure-notes"><summary>2. Selector-source examples: shared pattern vs per-lane VGPR</summary>
<h4>2. Selector source: shared scalar pattern or per-lane VGPR</h4>
<div class="wmma-panels">
<section class="wmma-panel" aria-labelledby="lane-scalar-heading">
<h4 id="lane-scalar-heading">RDNA 3 / 3.5 · scalar forms</h4>
<p>SRC1/SRC2 hold sixteen 4-bit selectors. L5 and L21 use the same slot, <code>s[5]</code>, because both have row offset 5.</p>
<div class="lane-pair"><code>s[5] = 3</code><span>→ same-row gather</span></div>
<div class="lane-pair"><code>L3 → L5</code><span>and</span><code>L19 → L21</code></div>
<details class="source-details"><summary>Sources</summary>

</details>
</section>
<section class="wmma-panel" aria-labelledby="lane-variable-heading">
<h4 id="lane-variable-heading">RDNA 4 · additional VAR forms</h4>
<p>Each destination reads its own SRC1 VGPR’s low four bits. Matching row offsets can choose different source offsets; the row-routing rules above still apply.</p>
<div class="lane-pair"><code>SRC1[L5] &amp; 15 = 3</code><span>→</span><code>L3 → L5</code></div>
<div class="lane-pair"><code>SRC1[L21] &amp; 15 = 7</code><span>→</span><code>L23 → L21</code></div>
<p>These two examples use the same-row form.</p>
<details class="source-details"><summary>Sources</summary>
<p class="refs"><a href="https://gpuopen.com/download/rdna4-instruction-set-architecture.pdf#page=513">RDNA 4 pp.513–514</a></p>
</details>
</section>

<p class="note"><strong>EXEC and controls:</strong> the active-lane examples do not illustrate inactive-source or suppressed-write cases. The original comparison below retains the scalar FI / BOUND_CTRL controls and the RDNA 4 <code>DS_BPERMUTE_FI_B32</code> exception. See the cited instruction definitions for masked-lane behavior and index wrapping.</p>
<details class="figure-notes"><summary>Diagram conventions and gather / scatter semantics</summary>
<p class="note"><strong>Reading the examples:</strong> <code>Lk</code> is lane k; <code>xk</code> is its original 32-bit source value. Arrows point from source data to the destination. All lanes are active in EXEC, indices are in range, and ABS / NEG / OMOD are zero. These are independent examples of instruction semantics, not physical wiring or timing diagrams.</p>
<p class="note"><strong>Gather versus scatter:</strong> the DS panels show <code>DS_BPERMUTE_B32</code>, where the destination selects its source. With <code>DS_PERMUTE_B32</code>, the source selects its destination; the same generation-specific lane ranges apply. These operations use LDS hardware without allocating LDS storage. Wave32 uses 32 lanes on all three generations.</p>
</details>
