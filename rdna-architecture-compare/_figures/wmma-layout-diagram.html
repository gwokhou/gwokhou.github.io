<figure class="wmma-diagram" aria-labelledby="wmma-diagram-title">
<figcaption>
<span id="wmma-diagram-title" class="visually-hidden">WMMA layout at a glance</span>
<p class="figure-scope"><strong>Scope:</strong> wave32, dense 16×16×16 WMMA, FP16/BF16 A/B inputs, FP32 C/D. Follow one lane pair: <code>t</code> and <code>t+16</code>, with <code>t=0…15</code>.</p>
</figcaption>
<div class="wmma-legend" aria-label="Lane-group legend"><span><span class="wmma-key wmma-key-zero" aria-hidden="true"></span><strong>q=0</strong> · lane t (0–15)</span><span><span class="wmma-key wmma-key-one" aria-hidden="true"></span><strong>q=1</strong> · lane t+16 (16–31)</span></div>
<p class="note">Inputs show K positions for both <code>A[t,k]</code> and <code>B[k,t]</code>: each filled block holds four values; empty blocks are absent from that lane. Each numbered output tile is a <code>C/D[row,t]</code> row coordinate. All three generations have <strong>8 FP32 outputs per lane</strong>.</p>
