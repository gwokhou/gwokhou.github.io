<figure class="wmma-diagram memory-diagram" aria-labelledby="cdna-path-caption">
<figcaption id="cdna-path-caption"><p class="figure-lead"><strong>Direct-to-LDS bypasses one payload staging step.</strong></p></figcaption>
<p class="figure-scope">Logical paths for gfx942 / gfx950. Arrows indicate data movement, not implicit completion or cache bypass.</p>
<div class="wmma-panels">
<div class="wmma-panel"><h4>Staging through VGPRs · both generations</h4><svg viewBox="0 0 340 445" role="img" aria-labelledby="cdna-staged-title cdna-staged-desc"><title id="cdna-staged-title">Global memory → VGPR payload → LDS tile → VGPR operands → MFMA</title><desc id="cdna-staged-desc">Both generations can stage global payload in VGPRs, write LDS, then read matrix operands to registers. Completion and synchronization requirements are omitted from the arrows.</desc><defs><marker id="cdna-staged-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245a91"/></marker></defs><rect x="22" y="10" width="296" height="44" rx="5" fill="#dbeafe" stroke="#245a91"/><text x="170" y="38" text-anchor="middle" font-size="16">Global memory</text><path d="M 170 54 V 94" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-staged-arrow)"/><rect x="34" y="64" width="272" height="21" fill="white"/><text x="170" y="79" text-anchor="middle" font-size="13">global load</text><rect x="22" y="100" width="296" height="44" rx="5" fill="#fff0d5" stroke="#945000"/><text x="170" y="128" text-anchor="middle" font-size="16">VGPR payload</text><path d="M 170 144 V 184" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-staged-arrow)"/><rect x="34" y="154" width="272" height="21" fill="white"/><text x="170" y="169" text-anchor="middle" font-size="13">LDS write</text><rect x="22" y="190" width="296" height="44" rx="5" fill="#e4f3ec" stroke="#286548"/><text x="170" y="218" text-anchor="middle" font-size="16">LDS tile</text><path d="M 170 234 V 274" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-staged-arrow)"/><rect x="34" y="244" width="272" height="21" fill="white"/><text x="170" y="259" text-anchor="middle" font-size="13">LDS read</text><rect x="22" y="280" width="296" height="44" rx="5" fill="#fff0d5" stroke="#945000"/><text x="170" y="308" text-anchor="middle" font-size="16">VGPR operands</text><path d="M 170 324 V 364" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-staged-arrow)"/><rect x="34" y="334" width="272" height="21" fill="white"/><text x="170" y="349" text-anchor="middle" font-size="13">matrix operation</text><rect x="22" y="370" width="296" height="44" rx="5" fill="#eee6f8" stroke="#66418b"/><text x="170" y="398" text-anchor="middle" font-size="16">MFMA</text></svg><p>Useful when the kernel must transform loaded values before storing them to LDS.</p></div>
<div class="wmma-panel"><h4>Direct path · both, with CDNA 4 additions</h4><svg viewBox="0 0 340 355" role="img" aria-labelledby="cdna-direct-title cdna-direct-desc"><title id="cdna-direct-title">Global memory → LDS tile → VGPR operands → MFMA</title><desc id="cdna-direct-desc">Both generations offer direct-to-LDS loading without intermediate VGPR payload staging. CDNA 4 adds 12/16-byte transfers and transpose LDS reads. Later reads still produce register operands.</desc><defs><marker id="cdna-direct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245a91"/></marker></defs><rect x="22" y="10" width="296" height="44" rx="5" fill="#dbeafe" stroke="#245a91"/><text x="170" y="38" text-anchor="middle" font-size="16">Global memory</text><path d="M 170 54 V 94" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-direct-arrow)"/><rect x="34" y="64" width="272" height="21" fill="white"/><text x="170" y="79" text-anchor="middle" font-size="13">direct-to-LDS load</text><rect x="22" y="100" width="296" height="44" rx="5" fill="#e4f3ec" stroke="#286548"/><text x="170" y="128" text-anchor="middle" font-size="16">LDS tile</text><path d="M 170 144 V 184" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-direct-arrow)"/><rect x="34" y="154" width="272" height="21" fill="white"/><text x="170" y="169" text-anchor="middle" font-size="13">LDS read / CDNA 4 transpose read</text><rect x="22" y="190" width="296" height="44" rx="5" fill="#fff0d5" stroke="#945000"/><text x="170" y="218" text-anchor="middle" font-size="16">VGPR operands</text><path d="M 170 234 V 274" stroke="#245a91" stroke-width="2" marker-end="url(#cdna-direct-arrow)"/><rect x="34" y="244" width="272" height="21" fill="white"/><text x="170" y="259" text-anchor="middle" font-size="13">matrix operation</text><rect x="22" y="280" width="296" height="44" rx="5" fill="#eee6f8" stroke="#66418b"/><text x="170" y="308" text-anchor="middle" font-size="16">MFMA</text></svg><p><strong>CDNA 4 additions:</strong> 12/16-byte direct transfers and element-width-specific LDS transpose reads.</p><p class="critical-condition">Direct-load completion is tracked as VMEM. A later LDS read and any cross-wave sharing still require the appropriate waits and synchronization.</p></div>
</div>
<details class="figure-notes"><summary id="data-path-evidence">Conditions and evidence</summary>
<p>Direct-load size, destination lane stride and wave-uniform base must match the selected interface. Transpose reads require their own LDS layout; they do not replace arbitrary shuffles or change where the global copy writes.</p>

</details></figure>
