<figcaption id="cdna-layout-caption"><p class="figure-lead"><strong>Wider K grows the input; the output tile stays 16×16.</strong></p></figcaption>
<p class="figure-scope">Wave64 · one dense FP16 → FP32 block · CBSZ=ABID=BLGP=0. Colors identify q, the group of 16 lanes; every group label is also written in text.</p>
<div class="wmma-panels packing-panels">
<div class="wmma-panel"><h4>CDNA 3 and 4 · K=16</h4><svg viewBox="0 0 340 250" role="img" aria-labelledby="cdna-k16-title cdna-k16-desc"><title id="cdna-k16-title">K=16: four complementary input groups</title><desc id="cdna-k16-desc">Lane groups 0 to 3 each supply 4 consecutive K positions in A row t or B column t. No group duplicates another.</desc><text x="12" y="24" font-size="15">A row t / B column t</text><rect x="12" y="44" width="316" height="36" rx="4" fill="#dbeafe" stroke="#245a91"/><text x="24" y="67" font-size="14">q=0 · lanes 0–15</text><text x="210" y="67" font-size="14">K 0–3</text><rect x="12" y="88" width="316" height="36" rx="4" fill="#fff0d5" stroke="#945000"/><text x="24" y="111" font-size="14">q=1 · lanes 16–31</text><text x="210" y="111" font-size="14">K 4–7</text><rect x="12" y="132" width="316" height="36" rx="4" fill="#e4f3ec" stroke="#286548"/><text x="24" y="155" font-size="14">q=2 · lanes 32–47</text><text x="210" y="155" font-size="14">K 8–11</text><rect x="12" y="176" width="316" height="36" rx="4" fill="#eee6f8" stroke="#66418b"/><text x="24" y="199" font-size="14">q=3 · lanes 48–63</text><text x="210" y="199" font-size="14">K 12–15</text><text x="12" y="240" font-size="14">4 FP16 values / lane / input</text></svg></div>
<div class="wmma-panel"><h4>CDNA 4 · K=32</h4><svg viewBox="0 0 340 250" role="img" aria-labelledby="cdna-k32-title cdna-k32-desc"><title id="cdna-k32-title">K=32: four complementary input groups</title><desc id="cdna-k32-desc">Lane groups 0 to 3 each supply 8 consecutive K positions in A row t or B column t. No group duplicates another.</desc><text x="12" y="24" font-size="15">A row t / B column t</text><rect x="12" y="44" width="316" height="36" rx="4" fill="#dbeafe" stroke="#245a91"/><text x="24" y="67" font-size="14">q=0 · lanes 0–15</text><text x="210" y="67" font-size="14">K 0–7</text><rect x="12" y="88" width="316" height="36" rx="4" fill="#fff0d5" stroke="#945000"/><text x="24" y="111" font-size="14">q=1 · lanes 16–31</text><text x="210" y="111" font-size="14">K 8–15</text><rect x="12" y="132" width="316" height="36" rx="4" fill="#e4f3ec" stroke="#286548"/><text x="24" y="155" font-size="14">q=2 · lanes 32–47</text><text x="210" y="155" font-size="14">K 16–23</text><rect x="12" y="176" width="316" height="36" rx="4" fill="#eee6f8" stroke="#66418b"/><text x="24" y="199" font-size="14">q=3 · lanes 48–63</text><text x="210" y="199" font-size="14">K 24–31</text><text x="12" y="240" font-size="14">8 FP16 values / lane / input</text></svg></div>
<div class="wmma-panel"><h4>Both examples · C/D</h4><svg viewBox="0 0 340 250" role="img" aria-labelledby="cdna-output-title cdna-output-desc"><title id="cdna-output-title">The same output rows for K=16 and K=32</title><desc id="cdna-output-desc">Each lane group owns four adjacent rows of the 16 by 16 output. Lane position t selects the column; g selects a row within the group.</desc><text x="12" y="24" font-size="15">D: 16 rows × 16 columns</text><rect x="12" y="44" width="316" height="36" rx="4" fill="#dbeafe" stroke="#245a91"/><text x="24" y="67" font-size="14">q=0 · rows 0–3</text><text x="210" y="67" font-size="14">column t</text><rect x="12" y="88" width="316" height="36" rx="4" fill="#fff0d5" stroke="#945000"/><text x="24" y="111" font-size="14">q=1 · rows 4–7</text><text x="210" y="111" font-size="14">column t</text><rect x="12" y="132" width="316" height="36" rx="4" fill="#e4f3ec" stroke="#286548"/><text x="24" y="155" font-size="14">q=2 · rows 8–11</text><text x="210" y="155" font-size="14">column t</text><rect x="12" y="176" width="316" height="36" rx="4" fill="#eee6f8" stroke="#66418b"/><text x="24" y="199" font-size="14">q=3 · rows 12–15</text><text x="210" y="199" font-size="14">column t</text><text x="12" y="240" font-size="14">4 FP32 values / lane: D[4q+g, t]</text></svg></div>
